[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shram-ai-backend"
version = "0.1.0"
description = "ShramAI: Agentic AI-Powered Smart Labour Compliance & Inspection Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
