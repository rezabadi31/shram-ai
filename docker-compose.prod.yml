version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shram_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shram_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shram_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-shram_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shram_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: shram_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-shram_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-shram_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shram_backend_prod
    restart: always
    environment:
      ENVIRONMENT: production
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-shram-super-secret-key-production-compliance-ai-2026}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shram_admin}:${POSTGRES_PASSWORD:-shram_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-shram_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-shram_redis_secret}@redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173", "https://shram.gov.in"]'
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/deployment/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shram_frontend_prod
    restart: always
    ports:
      - "80:5173"
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  postgres_prod_data:
  redis_prod_data:
